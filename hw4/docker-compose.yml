services:
  postgres:
    image: postgres:14.18-bookworm
    environment:
      POSTGRES_DB: hw4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55443:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hw4"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 1536m
    cpus: 1.5

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.4.13
    environment:
      CLICKHOUSE_DB: hw4
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    ports:
      - "127.0.0.1:58123:8123"
      - "127.0.0.1:59000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "clickhouse", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 2g
    cpus: 2

volumes:
  postgres_data:
  clickhouse_data:
