version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests: [not_null, unique]
  - name: dim_category
    columns:
      - name: category_key
        tests: [not_null, unique]
      - name: category_slug
        tests:
          - not_null
          - accepted_values:
              values:
                - cinema
                - concert
                - education
                - entertainment
                - exhibition
                - festival
                - holiday
                - kids
                - other
                - party
                - social-activity
                - stock
                - theater
                - tour
                - unknown
  - name: dim_place
    columns:
      - name: place_key
        tests: [not_null, unique]
  - name: fct_event_occurrence
    columns:
      - name: event_occurrence_key
        tests: [not_null, unique]
      - name: event_title
        tests: [not_null]
      - name: source_system
        tests:
          - accepted_values:
              values: [kudago, partner_test]
      - name: date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: category_key
        tests:
          - relationships:
              to: ref('dim_category')
              field: category_key
      - name: place_key
        tests:
          - relationships:
              to: ref('dim_place')
              field: place_key
  - name: mart_daily_events
    columns:
      - name: mart_key
        tests: [not_null, unique]
