version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests: [not_null, unique]
  - name: dim_region
    columns:
      - name: region_key
        tests: [not_null, unique]
      - name: region_code
        tests: [not_null, unique]
  - name: dim_sphere
    columns:
      - name: sphere_key
        tests: [not_null, unique]
      - name: sphere_name
        tests: [not_null, unique]
  - name: fct_vacancies
    columns:
      - name: vacancy_snapshot_key
        tests: [not_null, unique]
      - name: snapshot_date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: region_key
        tests:
          - relationships:
              to: ref('dim_region')
              field: region_key
      - name: sphere_key
        tests:
          - relationships:
              to: ref('dim_sphere')
              field: sphere_key
      - name: vacancy_id
        tests: [not_null]
  - name: mart_regional_sphere_demand
    columns:
      - name: snapshot_date
        tests: [not_null]
      - name: region_code
        tests: [not_null]
      - name: sphere_name
        tests: [not_null]
      - name: vacancy_count
        tests: [not_null]
